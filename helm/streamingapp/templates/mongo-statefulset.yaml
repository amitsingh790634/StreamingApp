{{- if .Values.mongo.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.mongo.serviceName }}
  labels:
    {{- include "streamingapp.componentLabels" (dict "root" . "component" "mongo") | nindent 4 }}
spec:
  serviceName: {{ .Values.mongo.serviceName }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "streamingapp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mongo
  template:
    metadata:
      labels:
        {{- include "streamingapp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mongo
    spec:
      containers:
        - name: mongo
          image: {{ include "streamingapp.image" (dict "root" . "repository" .Values.mongo.image "tag" .Values.mongo.tag) }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: mongodb
              containerPort: {{ .Values.mongo.port }}
          readinessProbe:
            exec:
              command: ["mongosh", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["mongosh", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.mongoResources | nindent 12 }}
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.mongo.storageClassName }}
        storageClassName: {{ .Values.mongo.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.mongo.storageSize }}
{{- end }}
