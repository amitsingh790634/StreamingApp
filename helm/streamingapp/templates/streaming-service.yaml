apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.services.streaming.serviceName }}
  labels:
    {{- include "streamingapp.componentLabels" (dict "root" . "component" .Values.services.streaming.name) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "streamingapp.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: {{ .Values.services.streaming.name }}
  ports:
    - name: http
      port: {{ .Values.services.streaming.port }}
      targetPort: http
