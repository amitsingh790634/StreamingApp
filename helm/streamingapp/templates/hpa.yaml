{{- if .Values.hpa.enabled }}
{{- range $key, $svc := (list .Values.services.auth .Values.services.streaming .Values.services.admin .Values.services.chat .Values.services.frontend) }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $svc.name }}
  labels:
    app.kubernetes.io/component: {{ $svc.name }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $svc.name }}
  minReplicas: {{ $.Values.hpa.minReplicas }}
  maxReplicas: {{ $.Values.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $.Values.hpa.cpuAverageUtilization }}
{{- end }}
{{- end }}
