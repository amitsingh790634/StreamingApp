<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 720" role="img" aria-label="StreamingApp Kubernetes architecture">
  <rect width="1180" height="720" fill="#0b1220"/>
  <text x="40" y="48" fill="#f8fafc" font-size="26" font-family="Helvetica, Arial, sans-serif" font-weight="700">StreamingApp  Kubernetes Architecture</text>
  <text x="40" y="76" fill="#94a3b8" font-size="14" font-family="Helvetica, Arial, sans-serif">Ingress ’ 5 microservices ’ MongoDB StatefulSet · Helm · Jenkins · ECR / Docker Hub · EKS</text>

  <rect x="40" y="110" width="200" height="70" rx="12" fill="#1d4ed8"/>
  <text x="140" y="142" text-anchor="middle" fill="#fff" font-size="15" font-family="Helvetica, Arial, sans-serif" font-weight="700">Users / Browsers</text>
  <text x="140" y="162" text-anchor="middle" fill="#dbeafe" font-size="12" font-family="Helvetica, Arial, sans-serif">streamingapp.local</text>

  <rect x="320" y="110" width="240" height="70" rx="12" fill="#0f766e"/>
  <text x="440" y="142" text-anchor="middle" fill="#fff" font-size="15" font-family="Helvetica, Arial, sans-serif" font-weight="700">Ingress (nginx)</text>
  <text x="440" y="162" text-anchor="middle" fill="#ccfbf1" font-size="12" font-family="Helvetica, Arial, sans-serif">path + host routing + WS</text>

  <line x1="240" y1="145" x2="320" y2="145" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="40" y="230" width="210" height="86" rx="12" fill="#1e293b" stroke="#38bdf8"/>
  <text x="145" y="262" text-anchor="middle" fill="#e2e8f0" font-size="15" font-family="Helvetica, Arial, sans-serif" font-weight="700">frontend :80</text>
  <text x="145" y="284" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="Helvetica, Arial, sans-serif">React + Nginx · / </text>
  <text x="145" y="302" text-anchor="middle" fill="#64748b" font-size="11" font-family="Helvetica, Arial, sans-serif">2 replicas</text>

  <rect x="270" y="230" width="210" height="86" rx="12" fill="#1e293b" stroke="#f97316"/>
  <text x="375" y="262" text-anchor="middle" fill="#e2e8f0" font-size="15" font-family="Helvetica, Arial, sans-serif" font-weight="700">auth :3001</text>
  <text x="375" y="284" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="Helvetica, Arial, sans-serif">/api  /api/auth  /health</text>
  <text x="375" y="302" text-anchor="middle" fill="#64748b" font-size="11" font-family="Helvetica, Arial, sans-serif">JWT · register · login</text>

  <rect x="500" y="230" width="210" height="86" rx="12" fill="#1e293b" stroke="#22c55e"/>
  <text x="605" y="262" text-anchor="middle" fill="#e2e8f0" font-size="15" font-family="Helvetica, Arial, sans-serif" font-weight="700">streaming :3002</text>
  <text x="605" y="284" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="Helvetica, Arial, sans-serif">/api/streaming</text>
  <text x="605" y="302" text-anchor="middle" fill="#64748b" font-size="11" font-family="Helvetica, Arial, sans-serif">catalogue · playback</text>

  <rect x="730" y="230" width="210" height="86" rx="12" fill="#1e293b" stroke="#eab308"/>
  <text x="835" y="262" text-anchor="middle" fill="#e2e8f0" font-size="15" font-family="Helvetica, Arial, sans-serif" font-weight="700">admin :3003</text>
  <text x="835" y="284" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="Helvetica, Arial, sans-serif">/api/admin</text>
  <text x="835" y="302" text-anchor="middle" fill="#64748b" font-size="11" font-family="Helvetica, Arial, sans-serif">uploads · curation</text>

  <rect x="960" y="230" width="180" height="86" rx="12" fill="#1e293b" stroke="#a855f7"/>
  <text x="1050" y="262" text-anchor="middle" fill="#e2e8f0" font-size="15" font-family="Helvetica, Arial, sans-serif" font-weight="700">chat :3004</text>
  <text x="1050" y="284" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="Helvetica, Arial, sans-serif">/api/chat · /socket.io</text>
  <text x="1050" y="302" text-anchor="middle" fill="#64748b" font-size="11" font-family="Helvetica, Arial, sans-serif">Socket.IO</text>

  <rect x="270" y="360" width="640" height="80" rx="12" fill="#111827" stroke="#64748b"/>
  <text x="590" y="392" text-anchor="middle" fill="#e2e8f0" font-size="16" font-family="Helvetica, Arial, sans-serif" font-weight="700">MongoDB StatefulSet + PVC  ·  Service mongo:27017</text>
  <text x="590" y="416" text-anchor="middle" fill="#94a3b8" font-size="13" font-family="Helvetica, Arial, sans-serif">Shared database for auth, videos, and chat history</text>

  <rect x="40" y="480" width="340" height="90" rx="12" fill="#111827" stroke="#38bdf8"/>
  <text x="210" y="512" text-anchor="middle" fill="#e2e8f0" font-size="15" font-family="Helvetica, Arial, sans-serif" font-weight="700">ConfigMap + Secret</text>
  <text x="210" y="536" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="Helvetica, Arial, sans-serif">PORT · CLIENT_URLS · AWS_REGION · MONGO_URI</text>
  <text x="210" y="554" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="Helvetica, Arial, sans-serif">JWT_SECRET · AWS keys</text>

  <rect x="410" y="480" width="360" height="90" rx="12" fill="#111827" stroke="#f97316"/>
  <text x="590" y="512" text-anchor="middle" fill="#e2e8f0" font-size="15" font-family="Helvetica, Arial, sans-serif" font-weight="700">CI  Jenkins</text>
  <text x="590" y="536" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="Helvetica, Arial, sans-serif">Git webhook ’ docker build ’ Docker Hub / ECR</text>
  <text x="590" y="554" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="Helvetica, Arial, sans-serif">Optional SNS ChatOps on success / failure</text>

  <rect x="800" y="480" width="340" height="90" rx="12" fill="#111827" stroke="#22c55e"/>
  <text x="970" y="512" text-anchor="middle" fill="#e2e8f0" font-size="15" font-family="Helvetica, Arial, sans-serif" font-weight="700">Observability</text>
  <text x="970" y="536" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="Helvetica, Arial, sans-serif">CloudWatch metrics + alarms</text>
  <text x="970" y="554" text-anchor="middle" fill="#94a3b8" font-size="12" font-family="Helvetica, Arial, sans-serif">Fluent Bit ’ CloudWatch Logs</text>

  <text x="40" y="620" fill="#94a3b8" font-size="13" font-family="Helvetica, Arial, sans-serif">ClusterIP Services keep pod-to-pod traffic internal. Only Ingress is exposed.</text>
  <text x="40" y="644" fill="#94a3b8" font-size="13" font-family="Helvetica, Arial, sans-serif">RollingUpdate: maxUnavailable=0, maxSurge=1. Probes on every Deployment.</text>
  <text x="40" y="668" fill="#64748b" font-size="12" font-family="Helvetica, Arial, sans-serif">S3 is used by admin (signed uploads) and streaming (playback). Optional for local smoke tests.</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
</svg>
