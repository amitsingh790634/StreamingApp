name: Publish images to Docker Hub

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/dockerhub-publish.yml"

env:
  DOCKERHUB_USER: amitsingh790634
  TAG: "1.0.0"

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || env.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        run: |
          set -euo pipefail
          docker build -t "$DOCKERHUB_USER/streaming-auth:$TAG" backend/authService
          docker build -t "$DOCKERHUB_USER/streaming-stream:$TAG" -f backend/streamingService/Dockerfile backend
          docker build -t "$DOCKERHUB_USER/streaming-admin:$TAG" -f backend/adminService/Dockerfile backend
          docker build -t "$DOCKERHUB_USER/streaming-chat:$TAG" -f backend/chatService/Dockerfile backend
          docker build \
            --build-arg REACT_APP_AUTH_API_URL=http://streamingapp.local/api \
            --build-arg REACT_APP_STREAMING_API_URL=http://streamingapp.local/api \
            --build-arg REACT_APP_STREAMING_PUBLIC_URL=http://streamingapp.local \
            --build-arg REACT_APP_ADMIN_API_URL=http://streamingapp.local/api/admin \
            --build-arg REACT_APP_CHAT_API_URL=http://streamingapp.local/api/chat \
            --build-arg REACT_APP_CHAT_SOCKET_URL=http://streamingapp.local \
            -t "$DOCKERHUB_USER/streaming-frontend:$TAG" \
            frontend

          for name in streaming-auth streaming-stream streaming-admin streaming-chat streaming-frontend; do
            docker push "$DOCKERHUB_USER/$name:$TAG"
          done
